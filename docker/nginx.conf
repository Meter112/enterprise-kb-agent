# React 前端静态托管 + API 反代（compose web-ui 服务挂载）。
# 注意 API 路径没有 /api 前缀，location 必须逐条精确列出。
server {
    listen 80;

    # /chat（含 /chat/metrics）反代到 api 容器。
    # SSE 关键：关闭代理缓冲，token 事件才能即时转发给前端；超时放宽到 5 分钟。
    location /chat {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /documents {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;   # SPA fallback
    }
}
