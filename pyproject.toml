[project]
name = "kb-agent"
version = "0.1.0"
description = "企业级智能知识库问答 Agent（RAG + Agent），求职作品集项目"
requires-python = ">=3.11,<3.14"
dependencies = [
    "qdrant-client>=1.14",
    "FlagEmbedding>=1.3",
    "jieba>=0.42",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
    "openai>=1.40",
    "langgraph>=1.0",
    "langgraph-checkpoint-redis>=0.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_agent"]

# 国内 PyPI 镜像（清华）；其他网络环境可删除本段
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
